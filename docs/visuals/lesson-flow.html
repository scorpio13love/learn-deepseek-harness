<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>28 lesson flow</title>
<style>
  :root { --bg:#f5f7fb; --panel:#fff; --ink:#161a2c; --ink-soft:#343b54; --muted:#6f778d; --faint:#a0a6b6; --line:#dfe3ef; --brand:#5b5bd6; --brand-soft:#ecebff; --green:#158a63; --amber:#b87412; --red:#b33a3a; --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); }
  body.capture { overflow:hidden; }
  .stage { width:1280px; height:720px; transform-origin:top left; }
  .frame { position:relative; width:100%; height:100%; padding:28px 34px 22px; background:
    radial-gradient(circle at 18% 8%, rgba(91,91,214,.07), transparent 32%),
    linear-gradient(135deg,#f8f9fc,#eef2fa); overflow:hidden; }
  .frame:before { content:""; position:absolute; inset:0; background-image:linear-gradient(rgba(48,58,99,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(48,58,99,.035) 1px,transparent 1px); background-size:30px 30px; pointer-events:none; }
  .top { position:relative; display:flex; justify-content:space-between; align-items:flex-start; gap:20px; }
  .eyebrow { font-family:var(--mono); font-size:9px; letter-spacing:.11em; color:var(--accent); text-transform:uppercase; display:flex; align-items:center; gap:6px; }
  .eyebrow i { width:6px; height:6px; border-radius:50%; background:var(--accent); display:inline-block; }
  h1 { margin:9px 0 4px; font-size:30px; line-height:1.12; letter-spacing:-.035em; font-weight:750; }
  h1 em { font-style:normal; color:var(--accent); }
  .subtitle { margin:0; color:var(--muted); font-size:11.5px; }
  .badge-live { flex:0 0 auto; border:1px solid var(--line); border-radius:999px; background:rgba(255,255,255,.7); padding:6px 10px; font:9px var(--mono); letter-spacing:.08em; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }
  .badge-live b { width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 0 4px rgba(21,138,99,.1); }
  .flow { position:relative; display:flex; align-items:center; gap:0; margin:16px 0 14px; height:72px; }
  .node { position:relative; flex:1 1 0; min-width:0; display:flex; align-items:center; gap:8px; padding:10px 11px; border:1px solid var(--line); border-radius:11px; background:rgba(255,255,255,.85); opacity:.48; transition:opacity .25s, border-color .25s, box-shadow .25s; }
  .node.on { opacity:1; border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow:0 7px 18px rgba(30,40,80,.08); }
  .node.done { opacity:.82; }
  .node-icon { flex:0 0 auto; width:22px; height:22px; border-radius:50%; background:var(--brand-soft); color:var(--accent); display:grid; place-items:center; font:9px var(--mono); }
  .node b { display:block; font-size:11px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .node small { display:block; color:var(--muted); font:8px var(--mono); margin-top:2px; }
  .arrow { flex:0 0 18px; height:1px; background:var(--line); position:relative; }
  .arrow:after { content:""; position:absolute; right:0; top:-3px; border:3px solid transparent; border-left-color:var(--line); }
  .packet { position:absolute; left:0; top:31px; width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 5px color-mix(in srgb, var(--accent) 13%, transparent); opacity:0; transition:left .3s linear, opacity .2s; z-index:2; }
  .packet.on { opacity:1; }
  .main { display:grid; grid-template-columns:1.02fr 1.12fr .92fr; gap:12px; height:360px; }
  .panel { min-width:0; border:1px solid var(--line); border-radius:13px; background:rgba(255,255,255,.9); display:flex; flex-direction:column; overflow:hidden; }
  .panel-head { display:flex; align-items:center; justify-content:space-between; padding:9px 12px; border-bottom:1px solid var(--line); font:9px var(--mono); color:var(--muted); letter-spacing:.04em; }
  .panel-head b { color:var(--ink-soft); font-weight:600; }
  .panel-body { padding:12px; overflow:hidden; flex:1; }
  .label { font:9px var(--mono); letter-spacing:.08em; color:var(--accent); margin:0 0 5px; }
  .text { color:var(--ink-soft); font-size:11.5px; line-height:1.62; margin:0 0 12px; }
  .muted { color:var(--muted); }
  .why-box { border:1px solid color-mix(in srgb, var(--accent) 22%, var(--line)); background:color-mix(in srgb, var(--accent) 5%, #fff); border-radius:9px; padding:9px 10px; margin-top:10px; }
  .why-box .text { margin:0; font-size:10.5px; }
  .step-num { font:9px var(--mono); color:var(--muted); letter-spacing:.08em; }
  .big { margin:4px 0 6px; font-size:22px; line-height:1.15; font-weight:720; letter-spacing:-.02em; }
  .big em { font-style:normal; color:var(--accent); }
  .anchor { margin-top:12px; border-top:1px solid var(--line); padding-top:10px; }
  .anchor code { display:block; color:var(--brand); font:9px/1.5 var(--mono); word-break:break-all; background:var(--brand-soft); border-radius:6px; padding:6px 7px; }
  .stage-code { border:1px solid var(--line); border-radius:8px; padding:8px 9px; background:#fbfcff; font:9.5px/1.55 var(--mono); color:var(--ink-soft); white-space:pre-wrap; }
  .stage-code b { color:var(--brand); font-weight:600; }
  .bottom { position:relative; display:grid; grid-template-columns:1.5fr .85fr .85fr 1fr; gap:12px; align-items:end; margin-top:12px; }
  .caption h2 { margin:2px 0 3px; font-size:17px; letter-spacing:-.02em; }
  .caption p { margin:0; color:var(--muted); font-size:10px; line-height:1.45; }
  .kicker { font:8px var(--mono); letter-spacing:.1em; color:var(--accent); }
  .code-line { background:#fff; border:1px solid var(--line); border-radius:7px; padding:8px 9px; font:9px/1.45 var(--mono); color:var(--ink-soft); min-height:34px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .code-line b { color:var(--brand); font-weight:600; }
  .progress { display:flex; align-items:center; gap:4px; padding-bottom:2px; }
  .seg { flex:1; height:4px; border-radius:999px; background:var(--line); }
  .seg.done { background:color-mix(in srgb, var(--accent) 38%, var(--line)); }
  .seg.on { background:var(--accent); }
  .progress-label { flex:0 0 30px; text-align:right; font:8px var(--mono); color:var(--muted); }
  .controls { position:fixed; left:0; right:0; bottom:0; z-index:3; display:flex; flex-wrap:wrap; align-items:center; gap:7px; padding:8px 14px; background:rgba(255,255,255,.94); border-top:1px solid var(--line); font:11px var(--sans); }
  .controls button { border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); padding:5px 9px; font:10px var(--sans); cursor:pointer; white-space:nowrap; }
  .stage-jump { display:flex; gap:3px; flex-wrap:wrap; }
  .stage-jump button { padding:4px 6px; font:8px var(--mono); color:var(--muted); }
  .stage-jump button.active { border-color:var(--brand); color:var(--brand); background:var(--brand-soft); }
  .stage-jump button:hover { border-color:color-mix(in srgb, var(--brand) 45%, var(--line)); color:var(--brand); background:var(--brand-soft); }
  .stage-jump button:focus-visible { outline:2px solid var(--brand); outline-offset:1px; }
  .stage-jump button.active:hover { border-color:var(--brand); color:var(--brand); background:var(--brand-soft); }
  #scrub { flex:1; min-width:110px; accent-color:var(--brand); }
  #counter { font:9px var(--mono); color:var(--muted); }
  body.capture .controls { display:none; }
  body.capture *, body.capture *:before, body.capture *:after { transition:none !important; animation:none !important; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="frame" id="frame">
    <div class="top">
      <div>
        <div class="eyebrow"><i></i><span id="eyebrow">S04 · CORE · LESSON FLOW</span></div>
        <h1 id="title">stream &amp; attempt</h1>
        <p class="subtitle" id="subtitle"></p>
      </div>
      <div class="badge-live"><b></b> MECHANISM MAP</div>
    </div>
    <div class="flow" id="flow">
      <div class="packet" id="packet"></div>
    </div>
    <div class="main">
      <section class="panel">
        <div class="panel-head"><b>本课问题</b><span>what / why</span></div>
        <div class="panel-body">
          <p class="label">WHAT</p>
          <p class="text" id="what"></p>
          <p class="label" style="margin-top:12px">WHY</p>
          <div class="why-box"><p class="text" id="why"></p></div>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head"><b>当前步骤</b><span id="stage-count">01 / 07</span></div>
        <div class="panel-body">
          <div class="step-num" id="step-num">STEP 01</div>
          <div class="big" id="big"><em>问题</em></div>
          <p class="text" id="step-desc"></p>
          <div class="anchor"><p class="label">SOURCE ANCHOR</p><code id="anchor"></code></div>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head"><b>场景 / 产出</b><span>scenario</span></div>
        <div class="panel-body">
          <p class="label">SCENARIO</p>
          <p class="text" id="scene"></p>
          <p class="label" style="margin-top:12px">OUTPUT</p>
          <div class="stage-code" id="stage-code"></div>
        </div>
      </section>
    </div>
    <div class="bottom">
      <div class="caption">
        <div class="kicker" id="kicker">STAGE 01 / 07</div>
        <h2 id="caption-title">本课问题</h2>
        <p id="caption-desc"></p>
      </div>
      <div class="code-line" id="code-line"></div>
      <div class="code-line" id="code-line2"></div>
      <div class="progress" id="progress">
        <div class="seg" data-seg="0"></div><div class="seg" data-seg="1"></div><div class="seg" data-seg="2"></div><div class="seg" data-seg="3"></div><div class="seg" data-seg="4"></div><div class="seg" data-seg="5"></div><div class="seg" data-seg="6"></div>
        <span class="progress-label" id="progress-label">0%</span>
      </div>
    </div>
  </div>
</div>
<div class="controls">
  <button id="play">暂停</button><button id="prev">← 上一幕</button><button id="next">下一幕 →</button>
  <div class="stage-jump" id="stage-jump"></div>
  <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="进度">
  <span id="counter">0 / 119</span>
</div>
<script src="flow-data.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const capture = params.get('capture') === '1' || params.has('frame');
  const id = /^s\d{2}$/.test(params.get('lesson') || '') ? params.get('lesson') : 's04';
  const data = (window.FLOW || {})[id];
  if (!data) { document.body.innerHTML = '<p>missing lesson ' + id + '</p>'; throw new Error('missing lesson'); }
  const TOTAL = 120;
  const partColors = { core:'#5b5bd6', context:'#0c93ad', composition:'#8b5cf6', execution:'#b87412', product:'#158a63', quality:'#b33a3a' };
  document.documentElement.style.setProperty('--accent', partColors[data.part] || '#5b5bd6');
  const stages = [
    { at:0.00, kicker:'STAGE 01 / 07', title:'本课问题', desc:data.what, step:'STEP 00', big:'问题', active:-1, code:`${id} · ${data.anchor}`, code2:'先看地图，再读源码' },
    ...data.nodes.map((node, i) => ({ at:0.12 + i * 0.14, kicker:`STAGE ${String(i+2).padStart(2,'0')} / 07`, title:node, desc:`第 ${i+1} 步：${node}`, step:`STEP ${String(i+1).padStart(2,'0')}`, big:node, active:i, code:data.anchor, code2:`node ${i+1} / ${data.nodes.length}` })),
    { at:0.86, kicker:'STAGE 07 / 07', title:'收口', desc:data.scene, step:'OUTPUT', big:'收口', active:data.nodes.length-1, code:'offline tests / demo', code2:'完成本课边界' },
  ];
  let frame = Number(params.get('frame') ?? 0);
  if (!Number.isFinite(frame)) frame = 0;
  let playing = !capture;
  let raf = 0, last = 0;
  if (capture) document.body.classList.add('capture');
  const els = {
    eyebrow: document.getElementById('eyebrow'), title: document.getElementById('title'), subtitle: document.getElementById('subtitle'),
    flow: document.getElementById('flow'), packet: document.getElementById('packet'), what: document.getElementById('what'), why: document.getElementById('why'),
    scene: document.getElementById('scene'), anchor: document.getElementById('anchor'), stageCount: document.getElementById('stage-count'), stepNum: document.getElementById('step-num'),
    big: document.getElementById('big'), stepDesc: document.getElementById('step-desc'), stageCode: document.getElementById('stage-code'), kicker: document.getElementById('kicker'),
    captionTitle: document.getElementById('caption-title'), captionDesc: document.getElementById('caption-desc'), code: document.getElementById('code-line'), code2: document.getElementById('code-line2'),
    progress: document.getElementById('progress-label'), segs: [...document.querySelectorAll('[data-seg]')],
  };
  const labels = ['问题', ...data.nodes, '收口'];
  els.eyebrow.textContent = `${id.toUpperCase()} · ${data.part.toUpperCase()} · LESSON FLOW`;
  els.title.textContent = data.title;
  els.subtitle.textContent = data.subtitle;
  els.what.textContent = data.what || data.subtitle;
  els.why.textContent = data.why || data.subtitle;
  els.scene.textContent = data.scene || data.subtitle;
  els.anchor.textContent = data.anchor;
  const flowHtml = data.nodes.map((node, i) => `<div class="node" data-node="${i}"><div class="node-icon">${String(i+1).padStart(2,'0')}</div><div><b>${node}</b><small>step ${i+1}</small></div></div>`).join('<div class="arrow"></div>');
  els.flow.insertAdjacentHTML('afterbegin', flowHtml);
  const nodes = [...els.flow.querySelectorAll('[data-node]')];
  const jump = document.getElementById('stage-jump');
  jump.innerHTML = labels.map((label, i) => `<button data-stage="${i}">${i+1} ${label}</button>`).join('');
  const jumps = [...jump.querySelectorAll('[data-stage]')];

  function stageAt(t) { let index=0; for (let i=0;i<stages.length;i++) if (t>=stages[i].at) index=i; return index; }
  function setText(el, value) { el.textContent = value || ''; }
  function render(t) {
    const stage = stageAt(t); const item = stages[stage];
    setText(els.kicker, item.kicker); setText(els.captionTitle, item.title); setText(els.captionDesc, item.desc);
    setText(els.stageCount, `${String(stage+1).padStart(2,'0')} / 07`); setText(els.stepNum, item.step);
    els.big.innerHTML = item.active >= 0 ? `<em>${String(item.active+1).padStart(2,'0')}</em> ${item.big}` : '<em>01</em> 本课问题';
    setText(els.stepDesc, item.active >= 0 ? `本课第 ${item.active+1} 个边界：${item.big}` : data.what);
    els.code.innerHTML = `<b>${item.code.split(' ')[0]}</b> ${item.code.slice(item.code.indexOf(' ')+1)}`;
    els.code2.innerHTML = item.code2;
    els.stageCode.innerHTML = `<b>${stage === 6 ? 'OUTPUT' : 'STEP'}</b> ${String(Math.min(stage,6)).padStart(2,'0')}  ${item.active >= 0 ? data.nodes[item.active] : 'problem framing'}<br><span style="color:#6f778d">${item.active >= 0 ? data.anchor : 'read the lesson map, then the source anchor'}</span>`;
    els.progress.textContent = `${Math.round(t*100)}%`;
    nodes.forEach((node, i) => { node.classList.toggle('on', item.active===i); node.classList.toggle('done', item.active>i); });
    const packetOn = t > .05 && t < .99;
    els.packet.classList.toggle('on', packetOn);
    if (packetOn) { const p = Math.max(0, Math.min(1, (t-.05)/.92)); const first=nodes[0].offsetLeft, lastN=nodes[nodes.length-1]; els.packet.style.left = `${first + p*(lastN.offsetLeft + lastN.offsetWidth - first)}px`; }
    els.segs.forEach((seg,i)=>{ seg.classList.toggle('done',i<stage); seg.classList.toggle('on',i===stage); });
    jumps.forEach((b,i)=>{ b.classList.toggle('active',i===stage); b.setAttribute('aria-pressed',String(i===stage)); });
  }
  function setFrame(next) { frame = (next + TOTAL) % TOTAL; render(frame/(TOTAL-1)); document.getElementById('scrub').value=String(Math.round(frame/(TOTAL-1)*1000)); document.getElementById('counter').textContent=`${frame} / ${TOTAL-1}`; }
  window.setFrame = setFrame;
  function pause(){ playing=false; document.getElementById('play').textContent='播放'; cancelAnimationFrame(raf); }
  function goStage(i){ pause(); setFrame(Math.min(TOTAL-1, Math.ceil(stages[(i+stages.length)%stages.length].at*(TOTAL-1)))); }
  function tick(time){ if(!playing) return; if(!last) last=time; if(time-last>1000/10){ last=time; setFrame(frame+1); } raf=requestAnimationFrame(tick); }
  function fit(){ if(capture) return; const scale=Math.min(window.innerWidth/1280,(window.innerHeight-48)/720); document.getElementById('stage').style.transform=`scale(${scale})`; document.body.style.height=`${720*scale+40}px`; }
  document.getElementById('play').addEventListener('click', (e)=>{ playing=!playing; e.currentTarget.textContent=playing?'暂停':'播放'; if(playing){last=0;raf=requestAnimationFrame(tick);} else cancelAnimationFrame(raf); });
  document.getElementById('prev').addEventListener('click', ()=>goStage(stageAt(frame/(TOTAL-1))-1));
  document.getElementById('next').addEventListener('click', ()=>goStage(stageAt(frame/(TOTAL-1))+1));
  jumps.forEach(b=>b.addEventListener('click',()=>goStage(Number(b.dataset.stage))));
  document.getElementById('scrub').addEventListener('input',(e)=>{ pause(); setFrame(Math.round(Number(e.currentTarget.value)/1000*(TOTAL-1))); });
  window.addEventListener('resize', fit); fit(); setFrame(frame); window.FLOW_READY = true;
  if (playing) { document.getElementById('play').textContent='暂停'; raf=requestAnimationFrame(tick); }
</script>
</body>
</html>
