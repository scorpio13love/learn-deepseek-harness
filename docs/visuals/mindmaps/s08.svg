<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title">
  <title id="title">s08 · Inbox / steering 知识点导图</title>
  <defs><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#303a63" stroke-opacity=".035"/></pattern></defs>
  <rect width="1200" height="820" fill="#fbfcff"/><rect width="1200" height="820" fill="url(#g)"/>
  <text x="48" y="40" font-size="9" letter-spacing=".12em" fill="#0c93ad" font-family="SFMono-Regular,Consolas,monospace">S08 · II · 上下文 · KNOWLEDGE POINTS</text>
  <text x="48" y="68" font-size="21" font-weight="750" fill="#222733" letter-spacing="-.02em" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">Inbox / steering</text>
  <circle cx="138" cy="410" r="58" fill="#0c93ad"/>
  <text x="138" y="392" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.7)" font-family="SFMono-Regular,Consolas,monospace">S08</text>
  <text x="138" y="414" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">Inbox / stee</text><text x="138" y="428" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">ring</text>
  <path d="M196 410 C308 410 290 82 360 82" fill="none" stroke="#0c93ad" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="62" width="205" height="42" rx="9" fill="#0c93ad"/>
      <text x="376" y="88" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">S 场景</text>
      <text x="592" y="84" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 用户中途插话，不能都伪装成普通消息。</text><text x="592" y="97.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 取消不是删除，已经发生的输入要有因果。</text><path d="M196 410 C308 410 290 195 360 195" fill="none" stroke="#0c93ad" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="175" width="205" height="42" rx="9" fill="#0c93ad"/>
      <text x="376" y="201" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">T 任务</text>
      <text x="592" y="197" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 运行中的输入有明确队列和取消语义</text><path d="M196 410 C308 410 290 308 360 308" fill="none" stroke="#0c93ad" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="288" width="205" height="42" rx="9" fill="#0c93ad"/>
      <text x="376" y="314" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">A 是什么</text>
      <text x="592" y="310" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• next-turn：每条消息独占一个新轮次。</text><text x="592" y="323.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• next-step：下次步骤边界消费。</text><text x="592" y="337" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• claim：从队列删除，逐条发 claimed。</text><path d="M196 410 C308 410 290 421 360 421" fill="none" stroke="#0c93ad" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="401" width="205" height="42" rx="9" fill="#0c93ad"/>
      <text x="376" y="427" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">A 怎么做</text>
      <text x="592" y="423" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• followup 进 next-turn 并唤醒。</text><text x="592" y="436.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• steer/inject 进 next-step；inj</text><text x="592" y="450" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  ect 不唤醒。</text><text x="592" y="463.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• turn 边界领全部 next-step + 一条 ne</text><text x="592" y="477" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  xt-turn；step 边界只领 next-step。</text><path d="M196 410 C308 410 290 534 360 534" fill="none" stroke="#0c93ad" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="514" width="205" height="42" rx="9" fill="#0c93ad"/>
      <text x="376" y="540" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">R 结果 / 边界</text>
      <text x="592" y="536" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• steering 在 step/end 后进历史。</text><text x="592" y="549.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 取消 keepInbox 保留待处理输入。</text><text x="592" y="563" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• whenIdle 等待整个 agent，不等待单条消息。</text><path d="M196 410 C308 410 290 647 360 647" fill="none" stroke="#0c93ad" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="627" width="205" height="42" rx="9" fill="#0c93ad"/>
      <text x="376" y="653" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">连接</text>
      <text x="592" y="649" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• s01 的 turn/step 提供边界。</text><text x="592" y="662.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• s03 的日志记录输入。</text>
