<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title">
  <title id="title">s01 · 最小 agent loop 知识点导图</title>
  <defs><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#303a63" stroke-opacity=".035"/></pattern></defs>
  <rect width="1200" height="900" fill="#fbfcff"/><rect width="1200" height="900" fill="url(#g)"/>
  <text x="48" y="40" font-size="9" letter-spacing=".12em" fill="#5b5bd6" font-family="SFMono-Regular,Consolas,monospace">S01 · I · 内核 · KNOWLEDGE POINTS</text>
  <text x="48" y="68" font-size="21" font-weight="750" fill="#222733" letter-spacing="-.02em" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">最小 agent loop</text>
  <circle cx="138" cy="450" r="58" fill="#5b5bd6"/>
  <text x="138" y="432" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.7)" font-family="SFMono-Regular,Consolas,monospace">S01</text>
  <text x="138" y="454" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">最小 agent loo</text><text x="138" y="468" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">p</text>
  <path d="M196 450 C308 450 290 78 360 78" fill="none" stroke="#5b5bd6" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="58" width="205" height="42" rx="9" fill="#5b5bd6"/>
      <text x="376" y="84" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">是什么 / 格式</text>
      <text x="592" y="78" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• turn：一次任务唤醒，从 turn/start 到 t</text><text x="592" y="91.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  urn/end。</text><text x="592" y="105" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• step：turn 里的一次模型请求，可能没有工具。</text><text x="592" y="118.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• attempt：一次流式请求的结算，成功/失败/取消都要</text><text x="592" y="132" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  收口。</text><path d="M196 450 C308 450 290 203 360 203" fill="none" stroke="#5b5bd6" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="183" width="205" height="42" rx="9" fill="#5b5bd6"/>
      <text x="376" y="209" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">在 agent 里的作用</text>
      <text x="592" y="203" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 取消后第二天接不上，因为发生过什么只在内存 messag</text><text x="592" y="216.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  es 里。</text><text x="592" y="230" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 只看最终回答，无法解释哪一步被中断、哪一步失败。</text><text x="592" y="243.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 一次纯文本 turn 可观察、可取消、可恢复</text><path d="M196 450 C308 450 290 328 360 328" fill="none" stroke="#5b5bd6" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="308" width="205" height="42" rx="9" fill="#5b5bd6"/>
      <text x="376" y="334" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">关键特征</text>
      <text x="592" y="328" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• turn/end 必须放在 finally，失败也要收口</text><text x="592" y="341.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  。</text><text x="592" y="355" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 取消保留已交付前缀，不丢用户看到的内容。</text><text x="592" y="368.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 请求从 deriveMessages 派生，不允许隐藏 </text><text x="592" y="382" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  messages 数组。</text><path d="M196 450 C308 450 290 453 360 453" fill="none" stroke="#5b5bd6" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="433" width="205" height="42" rx="9" fill="#5b5bd6"/>
      <text x="376" y="459" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">运行位置</text>
      <text x="592" y="453" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• turn/start → step/start → re</text><text x="592" y="466.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  quest/header 先入日志。</text><text x="592" y="480" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• SSE chunk 按 block index 进入 S</text><text x="592" y="493.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  treamAssembler。</text><text x="592" y="507" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• block-end → assistant/messag</text><text x="592" y="520.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  e → turn/end。</text><path d="M196 450 C308 450 290 578 360 578" fill="none" stroke="#5b5bd6" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="558" width="205" height="42" rx="9" fill="#5b5bd6"/>
      <text x="376" y="584" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">面试常问</text>
      <text x="592" y="578" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 为什么不是 while(true)？</text><text x="592" y="591.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• turn/end 为什么放 finally？</text><text x="592" y="605" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 取消为什么保留前缀？</text><path d="M196 450 C308 450 290 703 360 703" fill="none" stroke="#5b5bd6" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="683" width="205" height="42" rx="9" fill="#5b5bd6"/>
      <text x="376" y="709" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">架构连接</text>
      <text x="592" y="703" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• s02 把工具调用与结果接进同一条 turn。</text><text x="592" y="716.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• s03 把事件日志投影成 surface。</text>
  <line x1="48" y1="854" x2="1152" y2="854" stroke="#e3e6ef"/>
  <text x="48" y="876" font-size="9" fill="#a0a6b6" font-family="SFMono-Regular,Consolas,monospace">core/agent-loop/src/agent.ts</text>
