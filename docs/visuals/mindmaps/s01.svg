<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title">
  <title id="title">s01 · 最小 agent loop 知识点导图</title>
  <defs><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#303a63" stroke-opacity=".035"/></pattern></defs>
  <rect width="1200" height="780" fill="#fbfcff"/><rect width="1200" height="780" fill="url(#g)"/>
  <text x="48" y="40" font-size="9" letter-spacing=".12em" fill="#5b5bd6" font-family="SFMono-Regular,Consolas,monospace">S01 · I · 内核 · KNOWLEDGE POINTS</text>
  <text x="48" y="68" font-size="21" font-weight="750" fill="#222733" letter-spacing="-.02em" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">最小 agent loop</text>
  <circle cx="138" cy="390" r="58" fill="#5b5bd6"/>
  <text x="138" y="372" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.7)" font-family="SFMono-Regular,Consolas,monospace">S01</text>
  <text x="138" y="394" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">最小 agent loo</text><text x="138" y="408" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">p</text>
  <path d="M196 390 C308 390 290 82 360 82" fill="none" stroke="#5b5bd6" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="62" width="205" height="42" rx="9" fill="#5b5bd6"/>
      <text x="376" y="88" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">为什么</text>
      <text x="592" y="84" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 取消后第二天接不上，因为发生过什么只在内存 messag</text><text x="592" y="97.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  es 里。</text><text x="592" y="111" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 只看最终回答，无法解释哪一步被中断、哪一步失败。</text><path d="M196 390 C308 390 290 209.6 360 209.6" fill="none" stroke="#5b5bd6" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="189.6" width="205" height="42" rx="9" fill="#5b5bd6"/>
      <text x="376" y="215.6" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">核心概念</text>
      <text x="592" y="211.6" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• turn：一次任务唤醒，从 turn/start 到 t</text><text x="592" y="225.1" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  urn/end。</text><text x="592" y="238.6" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• step：turn 里的一次模型请求，可能没有工具。</text><text x="592" y="252.1" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• attempt：一次流式请求的结算，成功/失败/取消都要</text><text x="592" y="265.6" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  收口。</text><path d="M196 390 C308 390 290 337.2 360 337.2" fill="none" stroke="#5b5bd6" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="317.2" width="205" height="42" rx="9" fill="#5b5bd6"/>
      <text x="376" y="343.2" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">运行顺序</text>
      <text x="592" y="339.2" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• turn/start → step/start → re</text><text x="592" y="352.7" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  quest/header 先入日志。</text><text x="592" y="366.2" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• SSE chunk 按 block index 进入 S</text><text x="592" y="379.7" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  treamAssembler。</text><text x="592" y="393.2" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• block-end → assistant/messag</text><text x="592" y="406.7" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  e → turn/end。</text><path d="M196 390 C308 390 290 464.79999999999995 360 464.79999999999995" fill="none" stroke="#5b5bd6" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="444.79999999999995" width="205" height="42" rx="9" fill="#5b5bd6"/>
      <text x="376" y="470.79999999999995" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">边界/失败</text>
      <text x="592" y="466.79999999999995" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• turn/end 必须放在 finally，失败也要收口</text><text x="592" y="480.29999999999995" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  。</text><text x="592" y="493.79999999999995" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 取消保留已交付前缀，不丢用户看到的内容。</text><text x="592" y="507.29999999999995" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 请求从 deriveMessages 派生，不允许隐藏 </text><text x="592" y="520.8" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  messages 数组。</text><path d="M196 390 C308 390 290 592.4 360 592.4" fill="none" stroke="#5b5bd6" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="572.4" width="205" height="42" rx="9" fill="#5b5bd6"/>
      <text x="376" y="598.4" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">连接</text>
      <text x="592" y="594.4" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• s02 把工具调用与结果接进同一条 turn。</text><text x="592" y="607.9" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• s03 把事件日志投影成 surface。</text>
