  <text x="48" y="40" font-size="9" letter-spacing=".12em" fill="#b87412" font-family="SFMono-Regular,Consolas,monospace">S19 · IV · 执行边界 · KNOWLEDGE POINTS</text>
  <text x="48" y="68" font-size="21" font-weight="750" fill="#222733" letter-spacing="-.02em" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">Browser use</text>
  <circle cx="138" cy="390" r="58" fill="#b87412"/>
  <text x="138" y="372" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.7)" font-family="SFMono-Regular,Consolas,monospace">S19</text>
  <text x="138" y="394" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">Browser use</text>
  <path d="M196 390 C308 390 290 82 360 82" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="62" width="205" height="42" rx="9" fill="#b87412"/>
      <text x="376" y="88" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">为什么</text>
      <text x="592" y="84" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 浏览器不是 RPC，页面会在动作后变化。</text><text x="592" y="97.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 模型不能直接操作 DOM 或浏览器进程。</text><path d="M196 390 C308 390 290 209.6 360 209.6" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="189.6" width="205" height="42" rx="9" fill="#b87412"/>
      <text x="376" y="215.6" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">核心概念</text>
      <text x="592" y="211.6" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• BrowserProvider：单槽位注册。</text><text x="592" y="225.1" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• BrowserSession：会话拥有页面。</text><text x="592" y="238.6" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• ref 表：给模型稳定元素引用。</text><path d="M196 390 C308 390 290 337.2 360 337.2" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="317.2" width="205" height="42" rx="9" fill="#b87412"/>
      <text x="376" y="343.2" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">运行顺序</text>
      <text x="592" y="339.2" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• navigate 打开页面。</text><text x="592" y="352.7" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• read 返回文本与 ref。</text><text x="592" y="366.2" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• click(ref) 返回新快照。</text><path d="M196 390 C308 390 290 464.79999999999995 360 464.79999999999995" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="444.79999999999995" width="205" height="42" rx="9" fill="#b87412"/>
      <text x="376" y="470.79999999999995" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">边界/失败</text>
      <text x="592" y="466.79999999999995" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 动作后必须重新观测。</text><text x="592" y="480.29999999999995" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 旧 ref 失效。</text><text x="592" y="493.79999999999995" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 元素/会话错误变 isError。</text><path d="M196 390 C308 390 290 592.4 360 592.4" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="572.4" width="205" height="42" rx="9" fill="#b87412"/>
      <text x="376" y="598.4" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">连接</text>
      <text x="592" y="594.4" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• s20 把同样思路带到桌面。</text><text x="592" y="607.9" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• s14 用 capability seam 隔离宿主。</text>
