<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title">
  <title id="title">s19 · Browser use 知识点导图</title>
  <defs><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#303a63" stroke-opacity=".035"/></pattern></defs>
  <rect width="1200" height="900" fill="#fbfcff"/><rect width="1200" height="900" fill="url(#g)"/>
  <text x="48" y="40" font-size="9" letter-spacing=".12em" fill="#b87412" font-family="SFMono-Regular,Consolas,monospace">S19 · IV · 执行边界 · KNOWLEDGE POINTS</text>
  <text x="48" y="68" font-size="21" font-weight="750" fill="#222733" letter-spacing="-.02em" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">Browser use</text>
  <circle cx="138" cy="450" r="58" fill="#b87412"/>
  <text x="138" y="432" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.7)" font-family="SFMono-Regular,Consolas,monospace">S19</text>
  <text x="138" y="454" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">Browser use</text>
  <path d="M196 450 C308 450 290 78 360 78" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="58" width="205" height="42" rx="9" fill="#b87412"/>
      <text x="376" y="84" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">是什么 / 格式</text>
      <text x="592" y="78" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• BrowserProvider：单槽位注册。</text><text x="592" y="91.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• BrowserSession：会话拥有页面。</text><text x="592" y="105" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• ref 表：给模型稳定元素引用。</text><path d="M196 450 C308 450 290 203 360 203" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="183" width="205" height="42" rx="9" fill="#b87412"/>
      <text x="376" y="209" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">在 agent 里的作用</text>
      <text x="592" y="203" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 浏览器不是 RPC，页面会在动作后变化。</text><text x="592" y="216.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 模型不能直接操作 DOM 或浏览器进程。</text><text x="592" y="230" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 浏览器操作是回合制观测-动作-再观测</text><path d="M196 450 C308 450 290 328 360 328" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="308" width="205" height="42" rx="9" fill="#b87412"/>
      <text x="376" y="334" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">关键特征</text>
      <text x="592" y="328" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 动作后必须重新观测。</text><text x="592" y="341.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 旧 ref 失效。</text><text x="592" y="355" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 元素/会话错误变 isError。</text><path d="M196 450 C308 450 290 453 360 453" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="433" width="205" height="42" rx="9" fill="#b87412"/>
      <text x="376" y="459" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">运行位置</text>
      <text x="592" y="453" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• navigate 打开页面。</text><text x="592" y="466.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• read 返回文本与 ref。</text><text x="592" y="480" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• click(ref) 返回新快照。</text><path d="M196 450 C308 450 290 578 360 578" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="558" width="205" height="42" rx="9" fill="#b87412"/>
      <text x="376" y="584" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">面试常问</text>
      <text x="592" y="578" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 浏览器工具为什么是回合制？</text><text x="592" y="591.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 为什么要给模型 ref 表？</text><text x="592" y="605" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 动作后为什么必须重新观测？</text><path d="M196 450 C308 450 290 703 360 703" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="683" width="205" height="42" rx="9" fill="#b87412"/>
      <text x="376" y="709" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">架构连接</text>
      <text x="592" y="703" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• s20 把同样思路带到桌面。</text><text x="592" y="716.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• s14 用 capability seam 隔离宿主。</text>
