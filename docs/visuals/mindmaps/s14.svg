      <text x="376" y="314" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">A 是什么</text>
      <text x="592" y="310" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• Definition：稳定能力契约。</text><text x="592" y="323.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• Provider：本地/远程/沙箱实现。</text><text x="592" y="337" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• Consumer：工具/终端/LSP。</text><path d="M196 410 C308 410 290 421 360 421" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="401" width="205" height="42" rx="9" fill="#b87412"/>
      <text x="376" y="427" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">A 怎么做</text>
