  <path d="M196 450 C308 450 290 78 360 78" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="58" width="205" height="42" rx="9" fill="#b87412"/>
      <text x="376" y="84" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">是什么 / 格式</text>
      <text x="592" y="78" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• Definition：稳定能力契约。</text><text x="592" y="91.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• Provider：本地/远程/沙箱实现。</text><text x="592" y="105" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• Consumer：工具/终端/LSP。</text><path d="M196 450 C308 450 290 203 360 203" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="183" width="205" height="42" rx="9" fill="#b87412"/>
      <text x="376" y="209" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">在 agent 里的作用</text>
      <text x="592" y="203" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• agent 要读写文件、执行 Shell、访问网络。</text><text x="592" y="216.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 工具直连宿主，就无法替换成沙箱/远程。</text><text x="592" y="230" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• agent 通过 seam 安全地接触真实世界</text><path d="M196 450 C308 450 290 328 360 328" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="308" width="205" height="42" rx="9" fill="#b87412"/>
      <text x="376" y="334" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">关键特征</text>
      <text x="592" y="328" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 消费者不能绕过 seam。</text><text x="592" y="341.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 路径边界与工作区容器。</text><text x="592" y="355" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 策略失败 fail closed。</text><path d="M196 450 C308 450 290 453 360 453" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="433" width="205" height="42" rx="9" fill="#b87412"/>
      <text x="376" y="459" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">运行位置</text>
      <text x="592" y="453" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• tool 只调 ctx.fs / ctx.shell。</text><text x="592" y="466.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• provider 解析实际执行环境。</text><text x="592" y="480" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• approval/sandbox 在执行前决定。</text><path d="M196 450 C308 450 290 578 360 578" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="558" width="205" height="42" rx="9" fill="#b87412"/>
      <text x="376" y="584" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">面试常问</text>
      <text x="592" y="578" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 为什么能力不等于权限？</text><text x="592" y="591.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 消费者绕过 seam 会怎样？</text><text x="592" y="605" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• sandbox 策略失败为什么 fail closed？</text><path d="M196 450 C308 450 290 703 360 703" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="683" width="205" height="42" rx="9" fill="#b87412"/>
      <text x="376" y="709" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">架构连接</text>
      <text x="592" y="703" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• s06 的 pipeline 调能力。</text><text x="592" y="716.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• s19 browser 也是 provider seam</text><text x="592" y="730" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  。</text>
