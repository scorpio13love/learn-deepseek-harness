      <text x="592" y="197" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• agent 通过 seam 安全地接触真实世界</text><path d="M196 410 C308 410 290 308 360 308" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
