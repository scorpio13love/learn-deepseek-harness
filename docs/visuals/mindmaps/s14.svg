      <text x="592" y="84" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• agent 要读写文件、执行 Shell、访问网络。</text><text x="592" y="97.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 工具直连宿主，就无法替换成沙箱/远程。</text><path d="M196 410 C308 410 290 195 360 195" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
