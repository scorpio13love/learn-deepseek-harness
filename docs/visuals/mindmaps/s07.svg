<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title">
  <title id="title">s07 · 系统提示词 知识点导图</title>
  <defs><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#303a63" stroke-opacity=".035"/></pattern></defs>
  <rect width="1200" height="900" fill="#fbfcff"/><rect width="1200" height="900" fill="url(#g)"/>
  <text x="48" y="40" font-size="9" letter-spacing=".12em" fill="#0c93ad" font-family="SFMono-Regular,Consolas,monospace">S07 · II · 上下文 · KNOWLEDGE POINTS</text>
  <text x="48" y="68" font-size="21" font-weight="750" fill="#222733" letter-spacing="-.02em" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">系统提示词</text>
  <circle cx="138" cy="450" r="58" fill="#0c93ad"/>
  <text x="138" y="432" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.7)" font-family="SFMono-Regular,Consolas,monospace">S07</text>
  <text x="138" y="454" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">系统提示词</text>
  <path d="M196 450 C308 450 290 78 360 78" fill="none" stroke="#0c93ad" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="58" width="205" height="42" rx="9" fill="#0c93ad"/>
      <text x="376" y="84" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">是什么 / 格式</text>
      <text x="592" y="78" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• sections：有名字、顺序、稳定文本。</text><text x="592" y="91.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• contexts / variables：运行时注入的动</text><text x="592" y="105" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  态片段。</text><text x="592" y="118.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• head admission：决定 system 放开头</text><text x="592" y="132" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  还是追加历史。</text><path d="M196 450 C308 450 290 203 360 203" fill="none" stroke="#0c93ad" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="183" width="205" height="42" rx="9" fill="#0c93ad"/>
      <text x="376" y="209" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">在 agent 里的作用</text>
      <text x="592" y="203" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 提示词不是常量，会随工作区、权限、工具变化。</text><text x="592" y="216.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 每次重拼字符串会破坏稳定前缀与 KV cache。</text><text x="592" y="230" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 提示词可组装、可缓存、可准入</text><path d="M196 450 C308 450 290 328 360 328" fill="none" stroke="#0c93ad" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="308" width="205" height="42" rx="9" fill="#0c93ad"/>
      <text x="376" y="334" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">关键特征</text>
      <text x="592" y="328" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 稳定内容放前缀，动态内容放后部。</text><text x="592" y="341.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 秘密不进入提示词或日志。</text><text x="592" y="355" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• in-history 只追加，不回写开头 head。</text><path d="M196 450 C308 450 290 453 360 453" fill="none" stroke="#0c93ad" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="433" width="205" height="42" rx="9" fill="#0c93ad"/>
      <text x="376" y="459" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">运行位置</text>
      <text x="592" y="453" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 注册 section 与 context。</text><text x="592" y="466.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• renderContextMessage 渲染动态片段。</text><text x="592" y="480" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• system head 准入后生成请求。</text><path d="M196 450 C308 450 290 578 360 578" fill="none" stroke="#0c93ad" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="558" width="205" height="42" rx="9" fill="#0c93ad"/>
      <text x="376" y="584" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">面试常问</text>
      <text x="592" y="578" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 提示词为什么不是字符串常量？</text><text x="592" y="591.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 替换 head 与 in-history 的 cache</text><text x="592" y="605" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">   差异？</text><text x="592" y="618.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 哪些内容不能进系统提示词？</text><path d="M196 450 C308 450 290 703 360 703" fill="none" stroke="#0c93ad" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="683" width="205" height="42" rx="9" fill="#0c93ad"/>
      <text x="376" y="709" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">架构连接</text>
      <text x="592" y="703" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• s08 的 inbox 输入进入 prompt。</text><text x="592" y="716.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• s09 的 provider 决定请求如何发出。</text>
