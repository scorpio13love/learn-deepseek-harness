      <text x="376" y="314" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">A 是什么</text>
      <text x="592" y="310" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• threshold/retain：按窗口比例决定何时压、</text><text x="592" y="323.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  留多少。</text><text x="592" y="337" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• prune：先裁剪语义密度低的工具结果。</text><text x="592" y="350.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• summary：独立模型请求生成摘要。</text><path d="M196 410 C308 410 290 421 360 421" fill="none" stroke="#0c93ad" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="401" width="205" height="42" rx="9" fill="#0c93ad"/>
      <text x="376" y="427" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">A 怎么做</text>
      <text x="592" y="423" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• estimate 超过阈值。</text><text x="592" y="436.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• prune 替换超长 tool/result。</text><text x="592" y="450" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• summary 写回，surfaceOp replace</text><text x="592" y="463.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">   遮蔽旧段。</text><path d="M196 410 C308 410 290 534 360 534" fill="none" stroke="#0c93ad" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="514" width="205" height="42" rx="9" fill="#0c93ad"/>
