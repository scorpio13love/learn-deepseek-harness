<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title">
  <title id="title">s06 · 工具运行时 知识点导图</title>
  <defs><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#303a63" stroke-opacity=".035"/></pattern></defs>
  <rect width="1200" height="780" fill="#fbfcff"/><rect width="1200" height="780" fill="url(#g)"/>
  <text x="48" y="40" font-size="9" letter-spacing=".12em" fill="#5b5bd6" font-family="SFMono-Regular,Consolas,monospace">S06 · I · 内核 · KNOWLEDGE POINTS</text>
  <text x="48" y="68" font-size="21" font-weight="750" fill="#222733" letter-spacing="-.02em" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">工具运行时</text>
  <circle cx="138" cy="390" r="58" fill="#5b5bd6"/>
  <text x="138" y="372" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.7)" font-family="SFMono-Regular,Consolas,monospace">S06</text>
  <text x="138" y="394" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">工具运行时</text>
  <path d="M196 390 C308 390 290 82 360 82" fill="none" stroke="#5b5bd6" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="62" width="205" height="42" rx="9" fill="#5b5bd6"/>
      <text x="376" y="88" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">为什么</text>
      <text x="592" y="84" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 模型选择工具，不等于这次调用已经合法。</text><text x="592" y="97.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 写文件、Shell、并发批处理都可能互相踩踏。</text><path d="M196 390 C308 390 290 209.6 360 209.6" fill="none" stroke="#5b5bd6" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="189.6" width="205" height="42" rx="9" fill="#5b5bd6"/>
      <text x="376" y="215.6" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">核心概念</text>
      <text x="592" y="211.6" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• pre-execute：可扩展前置决策。</text><text x="592" y="225.1" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• guard：单调收紧，只能拒绝不能放行。</text><text x="592" y="238.6" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• approval：高风险动作的显式协议。</text><path d="M196 390 C308 390 290 337.2 360 337.2" fill="none" stroke="#5b5bd6" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="317.2" width="205" height="42" rx="9" fill="#5b5bd6"/>
      <text x="376" y="343.2" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">运行顺序</text>
      <text x="592" y="339.2" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• pre-execute → guard → approv</text><text x="592" y="352.7" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  al。</text><text x="592" y="366.2" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• approval 通过后进入 tools/execute</text><text x="592" y="379.7" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  。</text><text x="592" y="393.2" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• post-execute → finalizeConte</text><text x="592" y="406.7" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  nt → tools/result。</text><path d="M196 390 C308 390 290 464.79999999999995 360 464.79999999999995" fill="none" stroke="#5b5bd6" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="444.79999999999995" width="205" height="42" rx="9" fill="#5b5bd6"/>
      <text x="376" y="470.79999999999995" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">边界/失败</text>
      <text x="592" y="466.79999999999995" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 审批不可用必须 fail closed。</text><text x="592" y="480.29999999999995" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 并发必须显式声明，默认独占。</text><text x="592" y="493.79999999999995" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• tools/result 发布后只读，监听器不能改。</text><path d="M196 390 C308 390 290 592.4 360 592.4" fill="none" stroke="#5b5bd6" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="572.4" width="205" height="42" rx="9" fill="#5b5bd6"/>
      <text x="376" y="598.4" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">连接</text>
      <text x="592" y="594.4" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• s05 定义工具契约。</text><text x="592" y="607.9" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• s14 把 fs/shell/sandbox 变成可替换</text><text x="592" y="621.4" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  能力。</text>
