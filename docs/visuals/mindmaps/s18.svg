  <text x="138" y="454" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">Skills / com</text><text x="138" y="468" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">mands</text>
  <path d="M196 450 C308 450 290 78 360 78" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="58" width="205" height="42" rx="9" fill="#b87412"/>
      <text x="376" y="84" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">是什么 / 格式</text>
      <text x="592" y="78" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• SKILL.md：frontmatter + 正文。</text><text x="592" y="91.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• catalog：只含元数据，不含正文。</text><text x="592" y="105" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• load_skill：模型按需读取。</text><path d="M196 450 C308 450 290 203 360 203" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="183" width="205" height="42" rx="9" fill="#b87412"/>
      <text x="376" y="209" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">在 agent 里的作用</text>
      <text x="592" y="203" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 把所有 skill 正文放进 prompt 会挤占上下文</text><text x="592" y="216.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  。</text><text x="592" y="230" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 用户命令不应该走一次模型。</text><text x="592" y="243.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 技能按需加载，命令不产生模型轮次</text><path d="M196 450 C308 450 290 328 360 328" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="308" width="205" height="42" rx="9" fill="#b87412"/>
      <text x="376" y="334" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">关键特征</text>
      <text x="592" y="328" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• catalog 不泄露正文。</text><text x="592" y="341.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 重名 skill 拒绝。</text><text x="592" y="355" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• command 由 host 直接分派。</text><path d="M196 450 C308 450 290 453 360 453" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="433" width="205" height="42" rx="9" fill="#b87412"/>
      <text x="376" y="459" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">运行位置</text>
      <text x="592" y="453" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 扫描 bundle / flat .md。</text><text x="592" y="466.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• catalog 注入上下文。</text><text x="592" y="480" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 模型 load_skill，正文才进入。</text><path d="M196 450 C308 450 290 578 360 578" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="558" width="205" height="42" rx="9" fill="#b87412"/>
      <text x="376" y="584" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">面试常问</text>
      <text x="592" y="578" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• catalog 和 SKILL.md 正文有什么区别？</text><text x="592" y="591.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• slash command 为什么不产生模型轮次？</text><text x="592" y="605" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• skill 重名应该怎么处理？</text><path d="M196 450 C308 450 290 703 360 703" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="683" width="205" height="42" rx="9" fill="#b87412"/>
      <text x="376" y="709" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">架构连接</text>
      <text x="592" y="703" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• s17 MCP 是外部工具。</text><text x="592" y="716.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• s24 UI 可展示 skill/command 结果。</text>
