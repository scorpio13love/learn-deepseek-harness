  <path d="M196 410 C308 410 290 82 360 82" fill="none" stroke="#b33a3a" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="62" width="205" height="42" rx="9" fill="#b33a3a"/>
      <text x="376" y="88" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">S 场景</text>
      <text x="592" y="84" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 模型会被间接内容注入。</text><text x="592" y="97.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 策略不能依赖模型自觉，必须运行时强制。</text><path d="M196 410 C308 410 290 195 360 195" fill="none" stroke="#b33a3a" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="175" width="205" height="42" rx="9" fill="#b33a3a"/>
      <text x="376" y="201" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">T 任务</text>
      <text x="592" y="197" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 安全边界不依赖模型自觉</text><path d="M196 410 C308 410 290 308 360 308" fill="none" stroke="#b33a3a" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="288" width="205" height="42" rx="9" fill="#b33a3a"/>
      <text x="376" y="314" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">A 是什么</text>
      <text x="592" y="310" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 路径容器：realpath + relative。</text><text x="592" y="323.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 审批：绑定参数、调用者、有效期。</text><text x="592" y="337" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• redaction / allowlist：秘密与 CU</text><text x="592" y="350.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  A 授权。</text><path d="M196 410 C308 410 290 421 360 421" fill="none" stroke="#b33a3a" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="401" width="205" height="42" rx="9" fill="#b33a3a"/>
      <text x="376" y="427" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">A 怎么做</text>
      <text x="592" y="423" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 工具参数物化并冻结。</text><text x="592" y="436.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 路径/审批在副作用前检查。</text><text x="592" y="450" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 结果截断、脱敏、审计。</text><path d="M196 410 C308 410 290 534 360 534" fill="none" stroke="#b33a3a" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="514" width="205" height="42" rx="9" fill="#b33a3a"/>
      <text x="376" y="540" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">R 结果 / 边界</text>
      <text x="592" y="536" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• fail closed，不静默放宽。</text><text x="592" y="549.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 审批不复用。</text><text x="592" y="563" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 秘密不进日志或上下文。</text><path d="M196 410 C308 410 290 647 360 647" fill="none" stroke="#b33a3a" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="627" width="205" height="42" rx="9" fill="#b33a3a"/>
      <text x="376" y="653" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">连接</text>
      <text x="592" y="649" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• s14 的能力 seam。</text><text x="592" y="662.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• s21 的 CUA 授权。</text>
