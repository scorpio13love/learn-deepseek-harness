      <text x="592" y="84" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 模型会被间接内容注入。</text><text x="592" y="97.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 策略不能依赖模型自觉，必须运行时强制。</text><path d="M196 390 C308 390 290 209.6 360 209.6" fill="none" stroke="#b33a3a" stroke-opacity=".4" stroke-width="1.4"/>
