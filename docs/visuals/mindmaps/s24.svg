      <rect x="360" y="62" width="205" height="42" rx="9" fill="#158a63"/>
      <text x="376" y="88" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">为什么</text>
      <text x="592" y="84" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 原始事件不能直接渲染。</text><text x="592" y="97.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 工具/审批状态变化必须稳定映射。</text><path d="M196 390 C308 390 290 209.6 360 209.6" fill="none" stroke="#158a63" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="189.6" width="205" height="42" rx="9" fill="#158a63"/>
      <text x="376" y="215.6" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">核心概念</text>
      <text x="592" y="211.6" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• action card：text/tool/approv</text><text x="592" y="225.1" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  al/error。</text><text x="592" y="238.6" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 状态：running/done/failed/denie</text><text x="592" y="252.1" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">  d。</text><text x="592" y="265.6" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• snapshot + delta：首屏与增量。</text><path d="M196 390 C308 390 290 337.2 360 337.2" fill="none" stroke="#158a63" stroke-opacity=".4" stroke-width="1.4"/>
      <rect x="360" y="317.2" width="205" height="42" rx="9" fill="#158a63"/>
      <text x="376" y="343.2" font-size="13.5" font-weight="700" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">运行顺序</text>
      <text x="592" y="339.2" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• project events。</text><text x="592" y="352.7" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 工具卡合并 call/result。</text><text x="592" y="366.2" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 重连按 lastSeq 补事件。</text><path d="M196 390 C308 390 290 464.79999999999995 360 464.79999999999995" fill="none" stroke="#158a63" stroke-opacity=".4" stroke-width="1.4"/>
