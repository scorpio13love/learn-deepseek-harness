      <text x="592" y="84" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 桌面应用不是网页，读取需要系统授权。</text><text x="592" y="97.5" font-size="10.5" font-weight="400" fill="#3c3c43" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif">• 截图、AX、窗口都是外部状态。</text><path d="M196 390 C308 390 290 209.6 360 209.6" fill="none" stroke="#b87412" stroke-opacity=".4" stroke-width="1.4"/>
