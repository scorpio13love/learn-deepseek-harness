<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH 面试自测 · 6 个 Part</title>
<style>
  :root { --bg:#fff; --panel:#fff; --ink:#2c2c32; --soft:#3c3c43; --muted:#67676c; --line:#e6e6e9; --brand:#5b5bd6; --green:#158a63; --red:#b33a3a; --amber:#a15c1f; --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC",sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.7; }
  .wrap { max-width:900px; margin:0 auto; padding:42px 24px 100px; }
  .eyebrow { font:10px var(--mono); letter-spacing:.1em; color:var(--brand); text-transform:uppercase; }
  h1 { margin:10px 0 8px; font-size:34px; line-height:1.15; letter-spacing:-.035em; }
  .lead { margin:0; color:var(--muted); max-width:680px; }
  .meta { display:flex; flex-wrap:wrap; gap:8px; margin:20px 0 28px; }
  .chip { border:1px solid var(--line); border-radius:999px; padding:4px 9px; font:11px var(--mono); color:var(--muted); background:#fff; }
  .domain-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:10px 0 24px; }
  .domain-card { display:flex; justify-content:space-between; align-items:center; gap:10px; border:1px solid var(--line); border-radius:11px; padding:12px 14px; background:#fff; color:var(--ink); cursor:pointer; font:inherit; text-align:left; }
  .domain-card:hover { border-color:color-mix(in srgb,var(--brand) 45%,var(--line)); background:#fbfbff; }
  .domain-card b { font-size:14px; } .domain-card small { display:block; color:var(--muted); font:10px var(--mono); margin-top:2px; }
  .domain-card span { color:var(--brand); font:11px var(--mono); white-space:nowrap; }
  .primary, .secondary { border:1px solid transparent; border-radius:9px; padding:10px 15px; font:13px var(--sans); font-weight:650; cursor:pointer; }
  .primary { background:var(--brand); color:#fff; } .primary:hover { background:#4a4ac4; }
  .secondary { background:#fff; color:var(--soft); border-color:var(--line); } .secondary:hover { border-color:var(--soft); }
  .actions { display:flex; flex-wrap:wrap; gap:9px; margin-top:20px; }
  .quiz-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; color:var(--muted); font:11px var(--mono); }
  .bar { height:5px; border-radius:999px; background:#edeef3; overflow:hidden; margin:8px 0 24px; }
  .bar i { display:block; height:100%; background:var(--brand); transition:width .2s; }
  .question { border:1px solid var(--line); border-radius:14px; padding:22px 24px 20px; background:#fff; }
  .qtag { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px; }
  .qtag span { font:9px var(--mono); color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:3px 7px; }
  .question h2 { font-size:20px; line-height:1.5; margin:0 0 18px; letter-spacing:-.01em; }
  .option { display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left; border:1px solid var(--line); border-radius:9px; padding:11px 13px; margin:8px 0; background:#fff; color:var(--soft); font:14px/1.6 var(--sans); cursor:pointer; }
  .option:hover:not(:disabled) { border-color:color-mix(in srgb,var(--brand) 45%,var(--line)); background:#fbfbff; }
  .option .num { flex:0 0 20px; height:20px; border-radius:5px; background:#f3f4f7; color:var(--muted); font:10px var(--mono); display:grid; place-items:center; margin-top:1px; }
  .option.correct { border-color:color-mix(in srgb,var(--green) 45%,var(--line)); background:#f0faf5; }
  .option.correct .num { background:var(--green); color:#fff; }
  .option.wrong { border-color:color-mix(in srgb,var(--red) 45%,var(--line)); background:#fdf3f3; }
  .option.wrong .num { background:var(--red); color:#fff; }
  .option:disabled { cursor:default; opacity:.88; }
  .explain { margin-top:16px; border-left:3px solid var(--brand); background:#f7f7fb; border-radius:0 8px 8px 0; padding:12px 14px; color:var(--soft); font-size:13.5px; display:none; }
  .explain.show { display:block; }
  .explain b { color:var(--ink); }
  .ref { margin-top:8px; font:10.5px var(--mono); color:var(--muted); }
  .ref a { color:var(--brand); text-decoration:none; } .ref a:hover { text-decoration:underline; }
  .result { text-align:center; padding:26px 20px 10px; }
  .score { font-size:64px; line-height:1; font-weight:760; letter-spacing:-.06em; color:var(--brand); }
  .score small { font-size:18px; color:var(--muted); font-weight:500; letter-spacing:0; }
  .result h2 { margin:14px 0 4px; font-size:24px; }
  .result p { color:var(--muted); margin:0 0 20px; }
  .breakdown { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; text-align:left; margin:22px 0; }
  .brow { border:1px solid var(--line); border-radius:9px; padding:10px 12px; display:flex; justify-content:space-between; gap:8px; font:12px var(--mono); color:var(--muted); }
  .brow b { color:var(--ink); font-weight:600; }
  .wrong-list { text-align:left; margin:22px 0; }
  .wrong { border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:10px 0; }
  .wrong h3 { margin:0 0 8px; font-size:14px; line-height:1.5; }
  .wrong p { margin:4px 0; font-size:12.5px; color:var(--muted); }
  .wrong .yes { color:var(--green); } .wrong .no { color:var(--red); }
  .hidden { display:none; }
  .back{font:11px var(--mono);color:var(--muted);text-decoration:none}.back:hover{color:var(--brand)}
  html.embed #quiz-header, html.embed .foot, body.embed #quiz-header, body.embed .foot { display:none; }
  html.embed .wrap { max-width:none; padding:0 0 8px; }
  .foot { margin-top:26px; color:var(--muted); font:10px var(--mono); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  @media(max-width:700px){.wrap{padding:26px 16px 80px}h1{font-size:28px}.domain-grid,.breakdown{grid-template-columns:1fr}.question{padding:18px 16px}.score{font-size:52px}}

  .option.selected { border-color:color-mix(in srgb,var(--brand) 55%,var(--line)); background:#f7f7ff; }
  .option.selected .num { background:var(--brand); color:#fff; }
  .coding-question .lead { color:var(--muted); }
  .coding-state { margin:16px 0 4px; padding:12px 14px; border:1px solid var(--line); border-radius:9px; background:#fbfbfd; color:var(--muted); font-size:13px; }
  .coding-state.ok { border-color:color-mix(in srgb,var(--green) 35%,var(--line)); background:#f0faf5; color:var(--green); }

  .inline-coding-frame { margin:14px 0 2px; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; }
  .inline-coding-frame iframe { display:block; width:100%; height:700px; border:0; }
</style>
</head>
<body>
<div class="wrap">
  <div id="app"></div>
  <div class="foot"><span id="best"></span></div>
</div>
<script src="quiz-data.js"></script>
<script src="quiz-extra.js"></script>
<script src="quiz-app.js"></script>
</body>
</html>
